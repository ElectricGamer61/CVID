# Runs the two test suites that need nothing but source: the frontend's pure UI
# logic and the backend's reframe math. Everything else in this repo wants a live
# server, ffmpeg, or real media, so it stays a local check (see AGENTS.md).
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: frontend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  backend:
    name: backend reframe tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only what `test_reframe.py` imports. The pinned requirements files pull in
      # the whole render/transcribe stack, which this suite never touches.
      - run: python -m pip install --upgrade pip numpy opencv-python-headless
      - run: python test_reframe.py
        working-directory: backend
