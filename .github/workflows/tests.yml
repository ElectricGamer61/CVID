# Runs the test suites that need nothing but source: the frontend's pure UI logic and
# the backend's standalone suites (reframe math, Cinematic Look / big titles). Everything
# else in this repo wants a live server, ffmpeg, or real media, so it stays a local check
# (see AGENTS.md).
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: frontend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  backend:
    name: backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only what `test_reframe.py` imports. The pinned requirements files pull in
      # the whole render/transcribe stack, which this suite never touches.
      - run: python -m pip install --upgrade pip numpy opencv-python-headless
      - run: python test_reframe.py
        working-directory: backend
      - run: python test_look.py
        working-directory: backend
      - run: python test_intake.py
        working-directory: backend
      - run: python test_local_scorer.py
        working-directory: backend
      - run: python test_captions_fit.py
        working-directory: backend
      - run: python test_word_pieces.py
        working-directory: backend

  studio:
    name: studio build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - run: npm test
        working-directory: studio

  studio-backend:
    name: studio backend (real ffmpeg export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # test_studio.py renders a real export and checks it is frame-exact, in sync and
      # click-free, so it needs ffmpeg (Ubuntu's has libx264) and what app.studio imports.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip fastapi==0.115.6 python-multipart==0.0.20 numpy==2.2.1
      - run: python test_studio.py
        working-directory: backend
